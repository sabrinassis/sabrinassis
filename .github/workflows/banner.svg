<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#2a1d15"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c8a27a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#c8a27a" stop-opacity="0"/>
    </radialGradient>
    <style>
      .steam{fill:none;stroke:#c8a27a;stroke-width:3;stroke-linecap:round;opacity:.0;animation:rise 3.6s ease-in-out infinite}
      .s2{animation-delay:1.2s}.s3{animation-delay:2.4s}
      @keyframes rise{0%{opacity:0;transform:translateY(14px)}40%{opacity:.7}100%{opacity:0;transform:translateY(-14px)}}
    </style>
  </defs>
  <rect width="900" height="280" fill="url(#bg)"/>
  <circle cx="735" cy="150" r="150" fill="url(#glow)"/>
  <!-- código ao fundo -->
  <g font-family="Consolas,Menlo,monospace" font-size="12" fill="#c8a27a" opacity="0.10">
    <text x="30" y="40">function brew(coffee, code) {</text>
    <text x="30" y="58">  return clean(code + coffee);</text>
    <text x="30" y="76">}</text>
    <text x="30" y="250">$ git commit -m "mais um café, mais um deploy"</text>
  </g>
  <!-- título -->
  <text x="60" y="120" font-family="Georgia,'Times New Roman',serif" font-size="52" font-weight="bold" letter-spacing="6" fill="#f5efe6">SABRINA ASSIS</text>
  <rect x="60" y="136" width="440" height="3" fill="#c8a27a"/>
  <text x="62" y="170" font-family="Consolas,Menlo,monospace" font-size="15" letter-spacing="4" fill="#c8a27a">DESENVOLVEDORA EM FORMAÇÃO · ADS</text>
  <text x="62" y="206" font-family="Consolas,Menlo,monospace" font-size="14" fill="#8b949e">&lt;lógica /&gt; + &lt;design /&gt; + &lt;café /&gt; = interfaces que fazem sentido</text>
  <!-- xícara -->
  <g transform="translate(655,95)">
    <path class="steam" d="M60 20 C50 5 70 -5 60 -22"/>
    <path class="steam s2" d="M90 20 C80 5 100 -5 90 -22"/>
    <path class="steam s3" d="M120 20 C110 5 130 -5 120 -22"/>
    <path d="M30 40 H150 V100 Q150 150 90 150 Q30 150 30 100 Z" fill="#3b2a20" stroke="#c8a27a" stroke-width="3"/>
    <path d="M150 55 H170 Q190 55 190 80 Q190 105 165 105 H147" fill="none" stroke="#c8a27a" stroke-width="3"/>
    <ellipse cx="90" cy="40" rx="60" ry="8" fill="#1a110c" stroke="#c8a27a" stroke-width="3"/>
    <text x="90" y="108" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="34" font-weight="bold" fill="#c8a27a">&lt;/&gt;</text>
    <ellipse cx="90" cy="165" rx="85" ry="9" fill="#1a110c" stroke="#c8a27a" stroke-width="2"/>
  </g>
</svg>
